spring:
  application:
    name: booking-payments-api

  datasource:
    url: jdbc:postgresql://localhost:5432/booking_payments
    username: booking_user
    password: booking_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080